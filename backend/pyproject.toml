[project]
name = "fridgesense"
version = "0.1.0"
description = "FridgeSense backend: Ring access, webhook intake and Lambda handlers"
requires-python = ">=3.13"
dependencies = [
    "av>=14",  # decodes event clips for the door check
    "httpx>=0.28",
    "mangum>=0.22.0",
    "mcp>=2.3,<3",
    "pillow>=12.3.0",
    "pydantic>=2.9",
]

[project.scripts]
fridgesense-devices = "fridgesense.cli:devices_main"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb,secretsmanager]>=5.0",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]
clips = [  # kept so `uv sync --group clips` keeps working; av is now a runtime dependency
    "av>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "clips: door check on local fridge recordings (needs tmp/ clips and `uv sync --group clips`)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
