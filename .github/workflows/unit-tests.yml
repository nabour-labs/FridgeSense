name: Unit tests

# Runs on every PR to main. Tests only run when the PR changes code; docs/spec-only PRs
# still report a passing "unit-tests" check so branch protection never blocks them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Detect code changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Anything outside docs, specs, markdown and Claude config counts as code.
          code_files=$(git diff --name-only "$base" HEAD \
            | grep -vE '^(docs/|openspec/|\.claude/)|\.md$|^LICENSE$|^\.gitignore$' || true)
          echo "Code files changed:"; echo "${code_files:-<none>}"
          if [ -n "$code_files" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          ignore-nothing-to-cache: true
      - name: Run pytest
        run: |
          projects=$(git ls-files '*pyproject.toml' | xargs -r -n1 dirname)
          if [ -z "$projects" ]; then echo "No Python projects yet"; exit 0; fi
          for dir in $projects; do
            # Skip workspace members; the workspace root runs their tests.
            if [ "$dir" != "." ] && [ -f pyproject.toml ] && grep -q '\[tool.uv.workspace\]' pyproject.toml; then
              continue
            fi
            echo "::group::pytest in $dir"
            (cd "$dir" && uv sync --all-extras --dev && uv run pytest)
            echo "::endgroup::"
          done

  node:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run npm test
        run: |
          packages=$(git ls-files '*package.json' | grep -v node_modules | xargs -r -n1 dirname)
          if [ -z "$packages" ]; then echo "No Node packages yet"; exit 0; fi
          for dir in $packages; do
            if ! node -e "process.exit(require('./$dir/package.json').scripts?.test ? 0 : 1)"; then
              echo "Skipping $dir (no test script)"; continue
            fi
            echo "::group::npm test in $dir"
            (cd "$dir" && npm ci && npm test)
            echo "::endgroup::"
          done

  # The single required status check for branch protection.
  unit-tests:
    needs: [changes, python, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "code changed: ${{ needs.changes.outputs.code }}"
          echo "python: ${{ needs.python.result }}, node: ${{ needs.node.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          for r in "${{ needs.python.result }}" "${{ needs.node.result }}"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
